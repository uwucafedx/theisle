<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Isle Builds</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
        .card { background: #1e1e1e; border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid #333; }
        h2 { color: #4caf50; margin-top: 0; }
        ul { background: #2a2a2a; padding: 15px 30px; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Builds Recomendadas - The Isle</h1>
    <div id="contenedor-builds"></div>

    <script>
      const dinosaurios = [
        {
          nombre: "Deinosuchus",
          tipo: "carnivoro",
          imagen: "deino.png",
          buildRecomendada: {
            slot1: "Submerged Optical Retention (+5% visión acuática)",
            slot2: "Hydrodynamic (+15% vel. nado)",
            slot3: "Cellular Regeneration (+15% regen. salud)"
          },
          descripcion: "Build enfocada en dominio acuático y emboscada rápida."
        },
        {
          nombre: "Tenontosaurus",
          tipo: "herbivoro",
          imagen: "tenonto.png",
          buildRecomendada: {
            slot1: "Truculency (+5% bucking)",
            slot2: "Hypervigilance (+5% cámara/sonido)",
            slot3: "Epidermal Fibrosis (+15% res. sangrado)"
          },
          descripcion: "Build de combate directo contra carnívoros medianos."
        }
      ];

      // Código para mostrar los dinos en la pantalla
      const contenedor = document.getElementById("contenedor-builds");

      dinosaurios.forEach(dino => {
        contenedor.innerHTML += `
          <div class="card">
            <h2>${dino.nombre} (${dino.tipo})</h2>
            <p>${dino.descripcion}</p>
            <ul>
              <li><strong>Slot 1:</strong> ${dino.buildRecomendada.slot1}</li>
              <li><strong>Slot 2:</strong> ${dino.buildRecomendada.slot2}</li>
              <li><strong>Slot 3:</strong> ${dino.buildRecomendada.slot3}</li>
            </ul>
          </div>
        `;
      });
    </script>

</body>
</html>
